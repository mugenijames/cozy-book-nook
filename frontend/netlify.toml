[build]
  # Since 'Base Directory' is set to 'frontend' in the UI, 
  # these commands run INSIDE the frontend folder.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20" # Updated to match your Render backend version

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Remove the headers section for now to ensure 
# Netlify's auto-detection handles MIME types correctly.